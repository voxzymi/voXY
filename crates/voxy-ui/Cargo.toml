[package]
name = "voxy-ui"
description = "voXY application shell (egui + egui_dock)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
voxy-core.workspace = true
voxy-render.workspace = true
voxy-media.workspace = true
voxy-ofx-host.workspace = true
eframe = { workspace = true, features = ["wgpu", "default_fonts", "wayland", "x11", "accesskit"] }
egui.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
wgpu.workspace = true
# Reading images and file paths off the system clipboard for paste-to-import.
# Already in the tree via eframe; pinned to the same version.
arboard = "3.6.1"
# Encoding a pasted image to a PNG on disk before importing it.
image.workspace = true

[dev-dependencies]
tempfile.workspace = true
