# voXY third-party credits for OpenFX: the single source of truth.
#
# The README section "Third-party OFX plugins and credits", the matching
# section of LICENSING.md and the in-app About & Credits dialog are all
# generated from (or read directly from) this file. Edit it here, never
# in those places.
#
# Generator and CI check: `cargo xtask credits [--check]` (arrives with
# O-A). Until then the README and LICENSING.md blocks between the
# `credits:begin` / `credits:end` markers are kept in sync by hand.
#
# Fields:
#   id          stable identifier, also used by the CI fixture list
#   name        display name
#   authors     authors or maintainers, as the project credits them
#   url         upstream project
#   version     release tag, if any
#   commit      exact pinned commit
#   license     SPDX expression, read from the project's license file
#   license_url link to the license file at the pinned commit
#   copyright   copyright line exactly as the license file gives it
#   use         "host-api" (voXY implements this API)
#               "fixture"  (built in CI as a test fixture, never shipped)
#               "download" (offered to users; needs the owner's decision)
#   status      "approved" or "proposed" (shortlisted, waiting for the
#               owner's approval). The README, LICENSING.md and the app
#               list only "approved" entries.
#   sha256      checksum of anything downloaded (filled when first fetched)

schema = 1

[[credit]]
id = "openfx-api"
name = "OpenFX (OFX) image-effect API"
authors = ["OpenFX and contributors to the OpenFX project", "Academy Software Foundation"]
url = "https://github.com/AcademySoftwareFoundation/openfx"
version = "OFX_Release_1.5.1"
commit = "ab779510b2655b4d11a7e01e5c521f9aa8c88976"
license = "BSD-3-Clause"
license_url = "https://github.com/AcademySoftwareFoundation/openfx/blob/ab779510b2655b4d11a7e01e5c521f9aa8c88976/LICENSE.md"
copyright = "Copyright (c) 2025, OpenFX and contributors to the OpenFX project"
use = "host-api"
status = "approved"
note = "voXY's OpenFX host is written against these headers and the OpenFX specification."

