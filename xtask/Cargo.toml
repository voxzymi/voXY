[package]
name = "xtask"
description = "voXY developer tasks (license report, OpenFX bindings, credits)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
voxy-am-compat.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
# Same version as ffmpeg-sys-next's build dependency. `runtime` loads
# libclang only when `cargo xtask bindgen` runs, so builds never need it.
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
# `ofx-fixtures`: checksums, the source tarball, and the C++ compiler.
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1.1"
cc = "1.2"
